name: build

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*-*'
  pull_request:

# 同一分支/PR 的新 push 取消旧的进行中 run，避免并发空跑
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 默认最小权限；仅 release job 单独提权写 contents
permissions:
  contents: read

jobs:
  build-armv7:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build cross-compile image (layer-cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          load: true
          tags: callmeju-env:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cache cargo target (armv7)
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-armv7-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-armv7-

      - name: Cross-compile (armv7-linux-gnueabihf)
        run: docker run --rm -v "${{ github.workspace }}:/build" -w /build callmeju-env just release

      - name: Fix artifact ownership
        run: sudo chown -R "$(id -u):$(id -g)" target || true

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: callmeju-armv7-linux-gnueabihf
          path: target/armv7-unknown-linux-gnueabihf/release/callmeju
          if-no-files-found: error

  release:
    needs: build-armv7
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: callmeju-armv7-linux-gnueabihf
          path: ./artifact

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifact/callmeju
          generate_release_notes: true
