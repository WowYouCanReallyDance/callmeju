[package]
name = "callmeju"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "LLM voice-terminal thin client for the Xiaoju mini (RK3308) smart speaker"
license = "MIT OR Apache-2.0"

[dependencies]
# Async runtime — de-facto standard
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net", "io-util"] }
# HTTP client with streaming + rustls (no OpenSSL; keeps the armhf sysroot simple)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
# (de)serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.22"
# CLI
clap = { version = "4", features = ["derive"] }
# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Errors + streaming helpers
anyhow = "1"
bytes = "1"
futures-util = "0.3"

# Device-only dependencies (RK3308 / Linux)
[target.'cfg(target_os = "linux")'.dependencies]
# ALSA — direct access to pcmC1D0c / pcmC1D0p (27.7M downloads, updated 2026-07)
alsa = "0.12"

[profile.release]
opt-level = "z"     # minimize binary size for the 46MB-storage / 84MB-RAM device
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
